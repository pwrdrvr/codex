# Downstream Codex distribution for PwrDrvr products (PwrAgent, PwrSnap, PwrGit).
#
# This is deliberately NOT upstream's `rust-release.yml`. That workflow targets
# self-hosted runner groups (`<repo>-runners`) that do not exist on this fork,
# and signs through OpenAI's own `codesigning` environment. This one builds on
# GitHub-hosted runners only and signs with PwrDrvr credentials held in the
# `apple-signing` and `windows-signing` environments.
#
# Signing and macOS notarization are fail-closed: the protected jobs have no
# fallback to an unsigned or unnotarized asset, and `release-candidate`
# requires both platform signers.
#
# To exercise the signing path on a pull request, apply the `ci:release-signing`
# label. To publish, push a `pwragent-v*` tag.

name: Build PwrAgent Codex distribution

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled
      - reopened
      - synchronize
      - unlabeled
  push:
    tags:
      - "pwragent-v*"

permissions:
  contents: read
  id-token: none

concurrency:
  group: >-
    pwragent-codex-${{ github.ref }}-${{
      github.event_name == 'pull_request'
      && (github.event.action == 'labeled' || github.event.action == 'unlabeled')
      && github.event.label.name != 'ci:release-signing'
      && github.run_id
      || 'release-signing'
    }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && (github.event.action == 'synchronize'
        || github.event.action == 'reopened'
        || github.event.label.name == 'ci:release-signing') }}

jobs:
  metadata:
    name: Resolve release metadata
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'ci:release-signing')
      && (github.event.action == 'synchronize'
      || github.event.action == 'reopened'
      || github.event.label.name == 'ci:release-signing'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: none
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate release signing contract
        run: python3 scripts/pwragent-release/check-release-signing.py

      - name: Resolve downstream version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/pwragent-v* ]]; then
            version="${GITHUB_REF_NAME#pwragent-v}"
          else
            # Upstream main intentionally uses 0.0.0. Track the latest stable
            # upstream release baseline for this fork in a reviewed file so
            # development artifacts remain comparable by SemVer.
            upstream_version="$(tr -d '[:space:]' \
              < scripts/pwragent-release/upstream-version.txt)"
            test -n "$upstream_version"
            version="${upstream_version}-pwragent.dev.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Resolved version is not SemVer: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            release_asset: ""
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            release_asset: ""
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            release_asset: pwragent-codex-${{ needs.metadata.outputs.version }}-linux-aarch64.tar.gz
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            release_asset: pwragent-codex-${{ needs.metadata.outputs.version }}-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: none
    env:
      CODEX_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_ASSET: ${{ matrix.release_asset }}
      # Unlike upstream, downstream builds keep debuginfo out of the release
      # profile entirely; PwrDrvr products do not ship or upload dSYMs.
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      # Split restore/save on purpose. The combined `actions/cache` skips its
      # post-step save when the job fails, so a build killed at the timeout
      # threw away every object it had compiled. `if: always()` keeps the
      # partial target dir, letting the next attempt resume instead of
      # restarting. Upstream uses the same split in bazel.yml, guarded with
      # `!cancelled()`; that guard is omitted here because a timeout is exactly
      # the case whose output is worth keeping.
      - name: Restore Cargo cache
        id: cargo_cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.platform }}-

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build release binaries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_BUILD_VERSION="$CODEX_VERSION"
          cargo build --target "${{ matrix.target }}" --release \
            --bin codex \
            --bin codex-app-server \
            --bin codex-code-mode-host

      - name: Save Cargo cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: cargo-${{ matrix.platform }}-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage distribution
        shell: bash
        run: |
          set -euo pipefail
          release_dir="codex-rs/target/${{ matrix.target }}/release"
          dest="stage/${{ matrix.platform }}"
          mkdir -p "$dest"
          for binary in codex codex-app-server codex-code-mode-host; do
            install -m 0755 "${release_dir}/${binary}" "${dest}/${binary}"
          done
          cp LICENSE NOTICE "$dest/"
          cat > "${dest}/PWRAGENT-BUILD.txt" <<EOF
          version=${CODEX_VERSION}
          source_repository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          source_commit=${GITHUB_SHA}
          target=${{ matrix.target }}
          platform=${{ matrix.platform }}
          EOF

      - name: Verify staged binary versions
        shell: bash
        run: |
          set -euo pipefail
          dest="stage/${{ matrix.platform }}"
          test "$("${dest}/codex" --version)" = "codex-cli ${CODEX_VERSION}"
          test "$("${dest}/codex-app-server" --version)" = "codex-app-server ${CODEX_VERSION}"
          test "$("${dest}/codex-code-mode-host" --version)" = "codex-code-mode-host ${CODEX_VERSION}"

      - name: Package Linux distribution
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C "stage/${{ matrix.platform }}" -czf "$RELEASE_ASSET" .

      - name: Upload Linux release asset
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.release_asset }}
          if-no-files-found: error
          retention-days: 7

      - name: Archive macOS signing input
        id: archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/${{ matrix.platform }}-signing-input.tgz"
          tar -C "stage/${{ matrix.platform }}" -czf "$tarball" .
          sha256="$(shasum -a 256 "$tarball" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          printf "%s  %s-signing-input.tgz\n" "$sha256" "${{ matrix.platform }}" \
            > "$tarball.sha256"

      - name: Upload macOS signing input
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signing-input-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/${{ matrix.platform }}-signing-input.tgz
            ${{ runner.temp }}/${{ matrix.platform }}-signing-input.tgz.sha256
          if-no-files-found: error
          retention-days: 7

      # Finding 1: workflow_dispatch skips every signing job, so without this the
      # macOS half of a manual run produces nothing an operator can use.
      - name: Package unsigned manual-dispatch artifact
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tar -C "stage/${{ matrix.platform }}" \
            -czf "pwragent-codex-${CODEX_VERSION}-${{ matrix.platform }}-unsigned.tar.gz" .

      - name: Upload unsigned manual-dispatch artifact
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unsigned-${{ matrix.platform }}
          path: pwragent-codex-*-${{ matrix.platform }}-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 7

  macos-sign:
    name: Sign ${{ matrix.platform }}
    if: >-
      startsWith(github.ref, 'refs/tags/pwragent-v')
      || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'ci:release-signing'))
    needs:
      - metadata
      - build
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-aarch64
          - macos-x86_64
    runs-on: macos-15
    timeout-minutes: 60
    environment: apple-signing
    permissions:
      contents: read
      id-token: none
    env:
      CODEX_VERSION: ${{ needs.metadata.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download macOS signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signing-input-${{ matrix.platform }}
          path: .release-input

      # Unlike windows-sign, this cannot compare against a job output: GitHub
      # Actions cannot export per-entry outputs from a matrix job, and `build`
      # is a matrix. Within-run artifacts are therefore the trust boundary on
      # this side, and the checksum below guards transfer corruption rather
      # than substitution.
      - name: Verify macOS signing input
        shell: bash
        run: |
          set -euo pipefail
          cd .release-input
          shasum -a 256 --check "${PLATFORM}-signing-input.tgz.sha256"

      - name: Expand macOS signing input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          tar -C stage -xzf ".release-input/${PLATFORM}-signing-input.tgz"

      - name: Sign and verify macOS binaries
        env:
          # Base64-encoded Developer ID Application .p12 and its export
          # password. Store both only on the apple-signing GitHub Environment.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: T44CNHC4UH
        shell: bash
        run: |
          set -euo pipefail
          : "${CSC_LINK:?CSC_LINK is required}"
          : "${CSC_KEY_PASSWORD:?CSC_KEY_PASSWORD is required}"
          identity="Developer ID Application: PwrDrvr LLC (${APPLE_TEAM_ID})"
          certificate="$RUNNER_TEMP/pwrdrvr-developer-id.p12"
          keychain="$RUNNER_TEMP/pwrdrvr-release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          host_entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/codex-code-mode-host.entitlements.plist"
          test -f "$host_entitlements"

          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
          }
          trap cleanup EXIT

          certificate_base64="${CSC_LINK#data:application/x-pkcs12;base64,}"
          printf '%s' "$certificate_base64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "\"${identity}\""

          for binary in codex codex-app-server codex-code-mode-host; do
            if [[ "$binary" == codex-code-mode-host ]]; then
              codesign \
                --force \
                --keychain "$keychain" \
                --options runtime \
                --timestamp \
                --entitlements "$host_entitlements" \
                --sign "$identity" \
                "stage/${binary}"
            else
              codesign \
                --force \
                --keychain "$keychain" \
                --options runtime \
                --timestamp \
                --sign "$identity" \
                "stage/${binary}"
            fi
            codesign --verify --all-architectures --strict --verbose=2 "stage/${binary}"
            codesign --display --verbose=4 "stage/${binary}" \
              2> "$RUNNER_TEMP/${binary}-codesign.txt"
            grep -Fx "Authority=${identity}" "$RUNNER_TEMP/${binary}-codesign.txt"
            grep -Fx "TeamIdentifier=${APPLE_TEAM_ID}" "$RUNNER_TEMP/${binary}-codesign.txt"
          done

      - name: Notarize exact signed macOS binaries
        env:
          # Base64-encoded App Store Connect Team API key (.p8), Key ID, and
          # Issuer ID. Store all three only on the apple-signing environment.
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          scripts/pwragent-release/notarize-macos-binaries.sh \
            stage \
            "$RUNNER_TEMP/${PLATFORM}-notarized-binaries.sha256"

      - name: Package signed macOS distribution
        shell: bash
        run: |
          set -euo pipefail
          asset="pwragent-codex-${CODEX_VERSION}-${PLATFORM}.tar.gz"
          tar -C stage -czf "$asset" .
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Verify packaged macOS distribution
        shell: bash
        run: |
          set -euo pipefail
          asset="pwragent-codex-${CODEX_VERSION}-${PLATFORM}.tar.gz"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          tar -C "$verify_dir" -xzf "$asset"

          # This proves the published tarball contains the exact signed bytes
          # included in the Accepted notarization submission.
          (
            cd "$verify_dir"
            shasum -a 256 --check \
              "$RUNNER_TEMP/${PLATFORM}-notarized-binaries.sha256"
          )

          assess_gatekeeper() {
            local binary_path="$1"
            local assessment=""
            for attempt in 1 2 3 4 5 6; do
              if assessment="$(spctl --assess --type execute --verbose=4 \
                "$binary_path" 2>&1)" \
                && grep -Fq "source=Notarized Developer ID" <<< "$assessment"
              then
                printf '%s\n' "$assessment"
                return 0
              fi
              if [[ "$attempt" -lt 6 ]]; then
                sleep 10
              fi
            done
            printf '%s\n' "$assessment" >&2
            echo "::error::Gatekeeper did not recognize $(basename "$binary_path") as Notarized Developer ID." >&2
            return 1
          }

          for binary in codex codex-app-server codex-code-mode-host; do
            codesign --verify --all-architectures --strict --verbose=2 \
              "$verify_dir/$binary"
            assess_gatekeeper "$verify_dir/$binary"
          done

          # Raw Mach-O files and ZIP/tar archives are not stapler-supported.
          # notarytool's Accepted result is authoritative; spctl additionally
          # verifies Gatekeeper can retrieve the ticket for each exact binary.

          verified_host="$verify_dir/codex-code-mode-host"
          expected_entitlements="${GITHUB_WORKSPACE}/.github/scripts/macos-signing/codex-code-mode-host.entitlements.plist"
          actual_entitlements="$verify_dir/codex-code-mode-host.entitlements.plist"
          normalized_actual="$verify_dir/codex-code-mode-host.entitlements.normalized.plist"
          normalized_expected="$verify_dir/codex-code-mode-host.entitlements.expected.plist"
          codesign --verify --all-architectures --strict --verbose=2 "$verified_host"
          codesign --display --entitlements :- "$verified_host" > "$actual_entitlements"
          plutil -convert xml1 -o "$normalized_actual" "$actual_entitlements"
          plutil -convert xml1 -o "$normalized_expected" "$expected_entitlements"
          diff -u "$normalized_expected" "$normalized_actual"
          for entitlement_name in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.allow-unsigned-executable-memory
          do
            test "$(/usr/libexec/PlistBuddy -c "Print :$entitlement_name" "$actual_entitlements")" = true
          done

      - name: Upload signed macOS release asset
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  windows-prepare:
    name: Prepare Windows signing input
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: none
    outputs:
      signing-input-sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      CODEX_VERSION: ${{ needs.metadata.outputs.version }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: cargo-windows-x86_64-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            cargo-windows-x86_64-

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      - name: Configure LLVM linker
        uses: ./.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc

      # Ahead of the build on purpose: this takes about a minute and depends on
      # PSGallery, so failing it after a two-hour compile wastes the compile.
      - name: Prepare pinned TrustedSigning client
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: ./scripts/pwragent-release/prepare-trusted-signing.ps1 -OutputRoot signing-tools

      - name: Build release binaries
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          export CODEX_BUILD_VERSION="$CODEX_VERSION"
          cargo build --target x86_64-pc-windows-msvc --release \
            --bin codex \
            --bin codex-app-server \
            --bin codex-code-mode-host \
            --bin codex-windows-sandbox-setup \
            --bin codex-command-runner

      - name: Save Cargo cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            codex-rs/target
          key: cargo-windows-x86_64-${{ hashFiles('codex-rs/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stage Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "stage/windows-x86_64"
          New-Item -ItemType Directory -Force $dest | Out-Null
          $releaseDir = "codex-rs/target/x86_64-pc-windows-msvc/release"
          foreach ($binary in @(
            "codex.exe",
            "codex-app-server.exe",
            "codex-code-mode-host.exe",
            "codex-windows-sandbox-setup.exe",
            "codex-command-runner.exe"
          )) {
            Copy-Item (Join-Path $releaseDir $binary) (Join-Path $dest $binary)
          }
          Copy-Item LICENSE, NOTICE $dest
          @"
          version=$env:CODEX_VERSION
          source_repository=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY
          source_commit=$env:GITHUB_SHA
          target=x86_64-pc-windows-msvc
          platform=windows-x86_64
          "@ | Set-Content "$dest/PWRAGENT-BUILD.txt"

      - name: Verify staged binary versions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "stage/windows-x86_64"
          $expected = @{
            "codex.exe" = "codex-cli $env:CODEX_VERSION"
            "codex-app-server.exe" = "codex-app-server $env:CODEX_VERSION"
            "codex-code-mode-host.exe" = "codex-code-mode-host $env:CODEX_VERSION"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = & (Join-Path $dest $entry.Key) --version
            if ($LASTEXITCODE -ne 0 -or $actual -ne $entry.Value) {
              throw "$($entry.Key) version mismatch: expected '$($entry.Value)', got '$actual'"
            }
          }

      - name: Archive Windows signing input
        id: archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "windows-release-signing-input.tgz"
          & tar.exe -czf $archive stage/windows-x86_64 signing-tools scripts/pwragent-release
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to archive Windows signing input (exit code $LASTEXITCODE)."
          }
          $sha256 = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "$sha256  windows-release-signing-input.tgz" |
            Set-Content -Path "$archive.sha256" -Encoding ascii

      - name: Package unsigned manual-dispatch artifact
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path "stage/windows-x86_64/*"
          -DestinationPath "pwragent-codex-$env:CODEX_VERSION-windows-x86_64-unsigned.zip"

      - name: Upload unsigned manual-dispatch artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unsigned-windows-x86_64
          path: pwragent-codex-*-windows-x86_64-unsigned.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows signing input
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-release-signing-input
          path: |
            ${{ runner.temp }}/windows-release-signing-input.tgz
            ${{ runner.temp }}/windows-release-signing-input.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  windows-sign:
    name: Authenticode-sign Windows x64 binaries
    if: >-
      startsWith(github.ref, 'refs/tags/pwragent-v')
      || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'ci:release-signing'))
    needs:
      - metadata
      - windows-prepare
    runs-on: windows-2022
    timeout-minutes: 30
    environment: windows-signing
    permissions:
      contents: read
      id-token: none
    steps:
      - name: Download Windows signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-signing-input
          path: .release-input

      - name: Verify Windows signing input
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.windows-prepare.outputs.signing-input-sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = ".release-input/windows-release-signing-input.tgz"
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "Windows signing input digest mismatch: expected $env:EXPECTED_SHA256, got $actual."
          }
          $recorded = (Get-Content "$archive.sha256" -Raw).Trim()
          if ($recorded -ne "$actual  windows-release-signing-input.tgz") {
            throw "Windows signing input checksum file does not match the downloaded archive."
          }

      - name: Expand Windows signing input
        shell: pwsh
        run: |
          & tar.exe -xzf .release-input/windows-release-signing-input.tgz
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to expand Windows signing input (exit code $LASTEXITCODE)."
          }

      - name: Sign and verify Windows binaries
        shell: pwsh -NoProfile -NonInteractive -File {0}
        env:
          WIN_AZURE_SIGN_PUBLISHER_NAME: ${{ vars.WIN_AZURE_SIGN_PUBLISHER_NAME }}
          WIN_AZURE_SIGN_ENDPOINT: ${{ vars.WIN_AZURE_SIGN_ENDPOINT }}
          WIN_AZURE_SIGN_ACCOUNT: ${{ vars.WIN_AZURE_SIGN_ACCOUNT }}
          WIN_AZURE_SIGN_PROFILE: ${{ vars.WIN_AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >-
          ./scripts/pwragent-release/sign-windows-binaries.ps1
          -SigningToolsRoot signing-tools
          -BinaryPath stage/windows-x86_64/codex.exe,stage/windows-x86_64/codex-app-server.exe,stage/windows-x86_64/codex-code-mode-host.exe,stage/windows-x86_64/codex-windows-sandbox-setup.exe,stage/windows-x86_64/codex-command-runner.exe

      - name: Package signed Windows distribution
        shell: pwsh
        env:
          CODEX_VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          Compress-Archive
          -Path "stage/windows-x86_64/*"
          -DestinationPath "pwragent-codex-$env:CODEX_VERSION-windows-x86_64.zip"

      - name: Upload signed Windows release asset
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-windows-x86_64
          path: pwragent-codex-*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  release-candidate:
    name: Assemble signed release candidate
    if: >-
      startsWith(github.ref, 'refs/tags/pwragent-v')
      || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'ci:release-signing'))
    needs:
      - metadata
      - build
      - macos-sign
      - windows-sign
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          test "${#assets[@]}" -eq 5
          sha256sum "${assets[@]}" > SHA256SUMS

      - name: Generate machine-readable update manifest
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="pwragent-v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/pwragent-v* ]]; then
            test "$GITHUB_REF_NAME" = "$release_tag"
          fi
          python3 scripts/pwragent-release/generate-update-manifest.py manifest \
            --dist dist \
            --version "$VERSION" \
            --release-tag "$release_tag" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA"

      - name: Sign release assets and manifest with Sigstore provenance
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          create-storage-record: false
          subject-path: |
            dist/pwragent-codex-*.tar.gz
            dist/pwragent-codex-*.zip
            dist/SHA256SUMS
            dist/pwragent-codex-update-v1.json

      - name: Stage Sigstore bundle and publication-complete marker
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" dist/pwragent-codex-update-v1.json.sigstore.json
          python3 scripts/pwragent-release/generate-update-manifest.py marker \
            --dist dist \
            --version "$VERSION" \
            --release-tag "pwragent-v${VERSION}" \
            --source-commit "$GITHUB_SHA"
          test -f dist/pwragent-codex-publication-complete-v1.json

      - name: Upload signed release candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signed-release-candidate
          path: dist
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/pwragent-v')
    needs:
      - metadata
      - release-candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: none
    steps:
      - name: Download signed release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-candidate
          path: dist

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_title="PwrAgent Codex ${VERSION}"
          release_notes="Downstream Codex binaries for PwrDrvr products. Source commit: ${GITHUB_SHA}. macOS and Windows executables are signed by PwrDrvr LLC."
          if existing_release="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft,isPrerelease,name 2>/dev/null)"; then
            if jq -e \
              --arg title "$release_title" \
              --arg notes "$release_notes" \
              '.isDraft == true and .isPrerelease == true and .name == $title and .body == $notes' \
              <<<"$existing_release" >/dev/null; then
              echo "Removing matching incomplete draft release from an earlier attempt."
              gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
            else
              echo "::error::Release $RELEASE_TAG already exists; downstream assets are immutable." >&2
              exit 1
            fi
          fi
          marker="dist/pwragent-codex-publication-complete-v1.json"
          test -f "$marker"
          mapfile -t assets < <(find dist -maxdepth 1 -type f ! -name "$(basename "$marker")" -print | sort)
          draft_created=false
          cleanup_draft() {
            if [[ "$draft_created" == true ]]; then
              gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes || true
            fi
          }
          trap cleanup_draft ERR
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --title "$release_title" \
            --notes "$release_notes"
          draft_created=true
          gh release upload "$RELEASE_TAG" "$marker" --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          draft_created=false
          trap - ERR
